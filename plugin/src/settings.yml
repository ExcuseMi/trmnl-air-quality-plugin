---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.1
serverless_language: node
polling_url: "{% capture user_id %}{{ trmnl.user.id }}{% endcapture %}\r\n\r\nhttps://trmnl.bettens.dev/air-quality/api/aqi?address={{address | url_encode }}&temp_unit={{ temp_unit }}&wind_unit={{ wind_unit }}&locale={% if user_id == '6458' %}en{% else %}{{ trmnl.user.locale }}{% endif %}"
polling_headers: ''
polling_body: ''
id: 193113
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: Monitor air quality in real-time with detailed AQI readings from stations around you and 24-hour forecasts.<br /> Air quality data from AQICN/WAQI.
  github_url: https://github.com/ExcuseMi/trmnl-air-quality-plugin
  learn_more_url: https://aqicn.org
  category: environment
  help_text: TRMNL X Ready
- keyname: address
  optional: false
  field_type: string
  name: Location Address
  description: Your location (city, address, or landmark)
  help_text: Enter any address, city name, or landmark.
  placeholder: Brussels, Belgium
  default: Brussels, Belgium
- keyname: temp_unit
  name: Temperature Unit
  description: Select your preferred temperature unit
  field_type: select
  options:
  - Celsius
  - Fahrenheit
  default: celsius
- keyname: wind_unit
  name: Wind Speed Unit
  description: Select your preferred wind speed unit
  field_type: select
  options:
  - Kilometers per hour (km/h): kmh
  - Miles per hour (mph): mph
  - Meters per second (m/s): ms
  - Knots (kt): knots
  - Beaufort scale (Bft): beaufort
  default: kmh
name: Air Quality
description: Monitor air quality in real-time
refresh_interval: 1440
